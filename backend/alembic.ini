# Para criar migrações novas durante o desenvolvimento:
#   uv run alembic revision -m "descrição"
#   uv run alembic upgrade head
# O endereço do banco vem de TRACEFLOW_DATABASE_URL (veja migrations/env.py).
# Em produção quem aplica as migrações é o comando traceflow-migrate.

[alembic]
script_location = src/traceflow/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
