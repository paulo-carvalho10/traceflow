[project]
name = "traceflow"
version = "0.1.0"
description = "TraceFlow: ingestão, processamento e API de uma plataforma de observabilidade"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.149.0",
    "opentelemetry-proto>=1.45.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.54.0",
    "websockets>=14",
]

[project.scripts]
traceflow-ingest = "traceflow.ingest.app:main"
traceflow-processor = "traceflow.processor.app:main"
traceflow-migrate = "traceflow.migrate:main"
traceflow-api = "traceflow.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceflow"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["opentelemetry.proto.*", "google.protobuf.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["db: precisa do TimescaleDB rodando (docker compose up -d timescaledb)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
carga = [
    "httpx>=0.28.1",
]
dev = [
    "asyncpg-stubs>=0.32.0",
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
