name: traceflow

# O que ingestão, processador e migração têm em comum: a mesma imagem do backend.
x-backend: &backend
  build: ./backend
  image: traceflow/backend:dev
  restart: unless-stopped

x-database-url: &database-url postgresql://traceflow:traceflow@timescaledb:5432/traceflow

# A chave de ingestão da loja de demonstração. O valor padrão abaixo só serve no seu PC:
# em produção, TRACEFLOW_DEMO_INGEST_KEY vem de um segredo (e aparece aqui duas vezes porque
# o YAML não junta textos: uma para cadastrar a chave, outra para a loja usá-la).

# O que todo serviço da loja tem em comum. Cada um só troca o comando.
x-shop: &shop
  build: ./demo
  image: traceflow/shop:dev
  restart: unless-stopped
  environment:
    # Os spans vão para a ingestão do TraceFlow. Para comparar com o Jaeger, troque por
    # http://jaeger:4318/v1/traces e suba com: docker compose --profile jaeger up -d
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://ingest:4318/v1/traces
    OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${TRACEFLOW_DEMO_INGEST_KEY:-tf_devlocal_somente-desenvolvimento-local-0001}
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=demo
    OTEL_BSP_SCHEDULE_DELAY: "500"          # envia lotes a cada 500 ms (o padrão é 5 s)
    OTEL_SEMCONV_STABILITY_OPT_IN: http     # nomes novos: http.request.method, http.response.status_code...
    CHAOS_REDIS_URL: redis://redis:6379/1
  depends_on: [redis, ingest]

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # --- TraceFlow ---

  timescaledb:
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_USER: traceflow
      POSTGRES_PASSWORD: traceflow      # só para desenvolvimento; em produção vem de um segredo
      POSTGRES_DB: traceflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"     # para o psql e os testes de integração no seu PC
    healthcheck:
      # -h 127.0.0.1: pela rede. Na primeira subida a imagem roda um servidor temporário, que só
      # aceita conexões locais, e responderia "pronto" antes da hora pelo socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U traceflow -d traceflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Roda uma vez e termina: aplica as migrações que faltam (alembic upgrade head).
  migrate:
    <<: *backend
    command: ["traceflow-migrate"]
    restart: "no"
    environment:
      TRACEFLOW_DATABASE_URL: *database-url
      TRACEFLOW_DEMO_INGEST_KEY: ${TRACEFLOW_DEMO_INGEST_KEY:-tf_devlocal_somente-desenvolvimento-local-0001}
    depends_on:
      timescaledb: { condition: service_healthy }

  ingest:
    <<: *backend
    command: ["traceflow-ingest"]
    environment:
      TRACEFLOW_REDIS_URL: redis://redis:6379/0
      TRACEFLOW_DATABASE_URL: *database-url   # só para conferir chaves, com cache de 60 s
      TRACEFLOW_METRICS_PORT: "9464"         # GET /metrics (Prometheus), porta interna
    ports:
      - "4318:4318"     # OTLP/HTTP: aplicações de fora do Docker também podem mandar spans
      - "9101:9464"     # as métricas, para olhar do seu PC: http://localhost:9101/metrics
    depends_on:
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  processor:
    <<: *backend
    command: ["traceflow-processor"]
    environment:
      TRACEFLOW_REDIS_URL: redis://redis:6379/0
      TRACEFLOW_DATABASE_URL: *database-url
      TRACEFLOW_CONSUMER_NAME: processor-1
      TRACEFLOW_METRICS_PORT: "9464"         # GET /metrics (Prometheus), porta interna
    ports:
      - "9102:9464"     # http://localhost:9102/metrics
    depends_on:
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  api:
    <<: *backend
    command: ["traceflow-api"]
    environment:
      TRACEFLOW_REDIS_URL: redis://redis:6379/0
      TRACEFLOW_DATABASE_URL: *database-url
      # em produção: um segredo longo e aleatório, e TRACEFLOW_COOKIE_SECURE=true
      TRACEFLOW_JWT_SECRET: ${TRACEFLOW_JWT_SECRET:-segredo-de-desenvolvimento-troque-em-producao}
      TRACEFLOW_CORS_ORIGINS: '["http://localhost:3000"]'
      # o Incident Playground liga e desliga falhas na loja: o mesmo Redis, no banco do caos (1)
      TRACEFLOW_PLAYGROUND_REDIS_URL: redis://redis:6379/1
      TRACEFLOW_METRICS_PORT: "9464"         # GET /metrics (Prometheus), porta interna
    ports:
      - "8000:8000"     # a API: http://localhost:8000/docs
      - "9103:9464"     # http://localhost:9103/metrics
    depends_on:
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000     # o endereço da API visto pelo navegador
        NEXT_PUBLIC_INGEST_URL: http://localhost:4318
    image: traceflow/web:dev
    restart: unless-stopped
    ports:
      - "3000:3000"     # o produto: http://localhost:3000
    depends_on: [api]

  # Opcional, para comparar: só sobe com --profile jaeger
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: ["jaeger"]
    ports:
      - "16686:16686"   # interface do Jaeger: http://localhost:16686

  # O teste de carga (backend/loadtest): roda dentro da rede do Docker para medir o TraceFlow,
  # e não o caminho do Windows até o Docker. Só sobe pedido:
  #   docker compose --profile carga run --rm loadtest --steps 1000,2000,4000 --step-s 30
  loadtest:
    build: { context: ./backend, target: carga }
    image: traceflow/loadtest:dev
    profiles: ["carga"]
    entrypoint:
      - python
      - loadtest/loadtest.py
      - --ingest=http://ingest:4318/v1/traces
      - --api=http://api:8000
      - --ingest-metrics=http://ingest:9464/metrics
      - --processor-metrics=http://processor:9464/metrics
    environment:
      PYTHONIOENCODING: utf-8
    volumes:
      - ./backend/loadtest:/app/loadtest   # o código e os resultados, sem reconstruir a imagem
    depends_on: [ingest, api]

  # Opcional: um Prometheus de verdade lendo o /metrics do TraceFlow (--profile prometheus)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["prometheus"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"     # interface do Prometheus: http://localhost:9090

  gateway:
    <<: *shop
    command: ["uvicorn", "shop.services.gateway:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8100:8000"     # a loja, para testar à mão: http://localhost:8100/products

  orders:
    <<: *shop
    command: ["uvicorn", "shop.services.orders:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  inventory:
    <<: *shop
    command: ["uvicorn", "shop.services.inventory:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  payments:
    <<: *shop
    command: ["uvicorn", "shop.services.payments:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  notifications:
    <<: *shop
    command: ["uvicorn", "shop.services.notifications:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  # A API externa do banco: sem instrumentação, então sem as variáveis do OpenTelemetry.
  bank:
    <<: *shop
    command: ["uvicorn", "shop.services.bank:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      CHAOS_REDIS_URL: redis://redis:6379/1
    depends_on: [redis]

  loadgen:
    <<: *shop
    command: ["shop-loadgen"]
    environment:
      GATEWAY_URL: http://gateway:8000
      RPS: "20"
      CHECKOUT_RATIO: "0.3"
      CHAOS_REDIS_URL: redis://redis:6379/1   # o Playground muda o ritmo pelo hash demo:traffic
    depends_on: [gateway]

volumes:
  redisdata:
  pgdata:
